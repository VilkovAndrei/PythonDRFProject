version: "3"

services:

  db:
    image: postgres:latest
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "-c", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    tty: true
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/lms_app

  migration:
    build: .
    command: python manage.py makemigrations && python manage.py migrate
    depends_on:
      - db
    volumes:
      - .:/lms_app



  celery:
    build: .
    depends_on:
      web:
        condition: service_started
    tty: true
    command: celery -A config worker -l INFO -P eventlet
    volumes:
      - .:/lms_app


  celery-beat:
    build: .
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    tty: true
    command: python manage.py migrate && celery -A config beat -l INFO
    volumes:
      - .:/lms_app

volumes:
  pg_data: